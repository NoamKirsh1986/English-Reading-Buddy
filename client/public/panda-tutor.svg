<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260">
  <defs>
    <!-- Soft shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <!-- Warm sky background gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4f8"/>
      <stop offset="60%" stop-color="#fdf6e3"/>
      <stop offset="100%" stop-color="#d4edda"/>
    </linearGradient>
    <!-- Radial gradient for 3D roundness on head -->
    <radialGradient id="headGrad" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>
    <!-- Radial gradient for body -->
    <radialGradient id="bodyGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <!-- Radial gradient for belly -->
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </radialGradient>
    <!-- Ear inner gradient -->
    <radialGradient id="earInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <!-- Eye patch gradient -->
    <radialGradient id="patchGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <!-- Book cover gradient -->
    <linearGradient id="bookGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <!-- === BACKGROUND === -->
  <rect x="0" y="0" width="200" height="260" fill="url(#skyGrad)" rx="16"/>

  <!-- Grass ground -->
  <ellipse cx="100" cy="240" rx="110" ry="30" fill="#7bc67e"/>
  <ellipse cx="100" cy="238" rx="105" ry="26" fill="#8fd18f"/>
  <!-- Grass tufts -->
  <ellipse cx="30" cy="235" rx="8" ry="4" fill="#6ab86d"/>
  <ellipse cx="170" cy="237" rx="7" ry="3.5" fill="#6ab86d"/>
  <ellipse cx="60" cy="240" rx="6" ry="3" fill="#6ab86d"/>
  <ellipse cx="145" cy="242" rx="7" ry="3" fill="#6ab86d"/>

  <!-- === BODY (round, sitting) === -->
  <ellipse cx="100" cy="185" rx="52" ry="42" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Belly patch -->
  <ellipse cx="100" cy="182" rx="34" ry="30" fill="url(#bellyGrad)"/>

  <!-- === BOW TIE (red, teacher style) === -->
  <!-- Left triangle -->
  <polygon points="88,155 100,161 88,167" fill="#e74c3c"/>
  <!-- Right triangle -->
  <polygon points="112,155 100,161 112,167" fill="#e74c3c"/>
  <!-- Center knot -->
  <circle cx="100" cy="161" r="4" fill="#c0392b"/>

  <!-- === LEGS (stubby, pointing forward) === -->
  <ellipse cx="72" cy="215" rx="20" ry="14" fill="#1a1a1a" filter="url(#shadow)"/>
  <ellipse cx="128" cy="215" rx="20" ry="14" fill="#1a1a1a" filter="url(#shadow)"/>
  <!-- Leg sole pads -->
  <ellipse cx="72" cy="217" rx="12" ry="8" fill="#444"/>
  <circle cx="66" cy="211" r="3.5" fill="#444"/>
  <circle cx="72" cy="208" r="3.5" fill="#444"/>
  <circle cx="78" cy="211" r="3.5" fill="#444"/>
  <ellipse cx="128" cy="217" rx="12" ry="8" fill="#444"/>
  <circle cx="122" cy="211" r="3.5" fill="#444"/>
  <circle cx="128" cy="208" r="3.5" fill="#444"/>
  <circle cx="134" cy="211" r="3.5" fill="#444"/>

  <!-- === BOOK (held in front, between legs) === -->
  <!-- Book spine -->
  <rect x="82" cy="200" y="193" width="36" height="28" rx="2" fill="url(#bookGrad)" filter="url(#shadow)"/>
  <!-- Book pages (open) -->
  <rect x="85" y="196" width="30" height="22" rx="1" fill="#fff8e7"/>
  <!-- Page line details -->
  <line x1="89" y1="202" x2="111" y2="202" stroke="#ddd" stroke-width="0.8"/>
  <line x1="89" y1="206" x2="111" y2="206" stroke="#ddd" stroke-width="0.8"/>
  <line x1="89" y1="210" x2="107" y2="210" stroke="#ddd" stroke-width="0.8"/>
  <!-- Book center fold -->
  <line x1="100" y1="196" x2="100" y2="218" stroke="#e0d5c0" stroke-width="1"/>

  <!-- === ARMS (holding the book) === -->
  <ellipse cx="58" cy="178" rx="16" ry="11" fill="#1a1a1a" transform="rotate(-10 58 178)"/>
  <ellipse cx="142" cy="178" rx="16" ry="11" fill="#1a1a1a" transform="rotate(10 142 178)"/>
  <!-- Paw tips reaching toward book -->
  <ellipse cx="74" cy="196" rx="10" ry="8" fill="#1a1a1a"/>
  <ellipse cx="126" cy="196" rx="10" ry="8" fill="#1a1a1a"/>

  <!-- === HEAD (large, round, overlapping body) === -->
  <!-- Ears (behind head) -->
  <circle cx="52" cy="52" r="22" fill="url(#earInner)" filter="url(#shadow)"/>
  <circle cx="148" cy="52" r="22" fill="url(#earInner)" filter="url(#shadow)"/>
  <!-- Ear inner (slightly lighter) -->
  <circle cx="52" cy="52" r="12" fill="#2d2d2d"/>
  <circle cx="148" cy="52" r="12" fill="#2d2d2d"/>

  <!-- Head main shape -->
  <ellipse cx="100" cy="88" rx="62" ry="58" fill="url(#headGrad)" filter="url(#shadow)"/>

  <!-- === EYE PATCHES (dark ovals around eyes) === -->
  <ellipse cx="72" cy="82" rx="22" ry="19" fill="url(#patchGrad)" transform="rotate(-8 72 82)"/>
  <ellipse cx="128" cy="82" rx="22" ry="19" fill="url(#patchGrad)" transform="rotate(8 128 82)"/>

  <!-- === GLASSES (round teacher specs) === -->
  <!-- Left lens -->
  <circle cx="72" cy="82" r="20" fill="none" stroke="#8B6914" stroke-width="2.5"/>
  <!-- Right lens -->
  <circle cx="128" cy="82" r="20" fill="none" stroke="#8B6914" stroke-width="2.5"/>
  <!-- Bridge connecting lenses -->
  <path d="M 92 82 Q 100 78 108 82" fill="none" stroke="#8B6914" stroke-width="2.5"/>
  <!-- Left temple arm -->
  <line x1="52" y1="80" x2="40" y2="72" stroke="#8B6914" stroke-width="2" stroke-linecap="round"/>
  <!-- Right temple arm -->
  <line x1="148" y1="80" x2="160" y2="72" stroke="#8B6914" stroke-width="2" stroke-linecap="round"/>
  <!-- Lens glare (left) -->
  <ellipse cx="64" cy="76" rx="5" ry="3" fill="white" opacity="0.2" transform="rotate(-20 64 76)"/>
  <!-- Lens glare (right) -->
  <ellipse cx="120" cy="76" rx="5" ry="3" fill="white" opacity="0.2" transform="rotate(-20 120 76)"/>

  <!-- === EYES (big, round, shiny — 3D look, behind glasses) === -->
  <!-- Left eye white -->
  <ellipse cx="72" cy="80" rx="14" ry="15" fill="white"/>
  <!-- Left pupil -->
  <ellipse cx="74" cy="82" rx="9" ry="10" fill="#1a1a1a"/>
  <!-- Left eye shine (large) -->
  <circle cx="79" cy="77" r="5" fill="white" opacity="0.9"/>
  <!-- Left eye shine (small) -->
  <circle cx="70" cy="86" r="2.5" fill="white" opacity="0.6"/>

  <!-- Right eye white -->
  <ellipse cx="128" cy="80" rx="14" ry="15" fill="white"/>
  <!-- Right pupil -->
  <ellipse cx="126" cy="82" rx="9" ry="10" fill="#1a1a1a"/>
  <!-- Right eye shine (large) -->
  <circle cx="131" cy="77" r="5" fill="white" opacity="0.9"/>
  <!-- Right eye shine (small) -->
  <circle cx="122" cy="86" r="2.5" fill="white" opacity="0.6"/>

  <!-- Re-draw glasses on top of eyes for proper layering -->
  <circle cx="72" cy="82" r="20" fill="none" stroke="#8B6914" stroke-width="2.5"/>
  <circle cx="128" cy="82" r="20" fill="none" stroke="#8B6914" stroke-width="2.5"/>
  <path d="M 92 82 Q 100 78 108 82" fill="none" stroke="#8B6914" stroke-width="2.5"/>

  <!-- === NOSE (small, round, dark) === -->
  <ellipse cx="100" cy="100" rx="7" ry="5.5" fill="#1a1a1a"/>
  <!-- Nose highlight -->
  <ellipse cx="98" cy="98" rx="2.5" ry="1.5" fill="#444"/>

  <!-- === MOUTH (gentle smile) === -->
  <path d="M 90 107 Q 95 114 100 107" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 107 Q 105 114 110 107" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

  <!-- === ROSY CHEEKS === -->
  <ellipse cx="56" cy="98" rx="10" ry="7" fill="#ffb0c8" opacity="0.45"/>
  <ellipse cx="144" cy="98" rx="10" ry="7" fill="#ffb0c8" opacity="0.45"/>

  <!-- === MORTARBOARD / GRADUATION CAP === -->
  <!-- Cap board (diamond shape on top of head) -->
  <polygon points="100,22 145,38 100,50 55,38" fill="#1a1a1a" filter="url(#shadow)"/>
  <!-- Cap top highlight -->
  <polygon points="100,25 140,38 100,48 60,38" fill="#2a2a2a"/>
  <!-- Cap base (cylinder on head) -->
  <rect x="82" y="38" width="36" height="10" rx="2" fill="#1a1a1a"/>
  <!-- Tassel string -->
  <path d="M 100 36 L 140 36 L 142 42" fill="none" stroke="#f1c40f" stroke-width="2" stroke-linecap="round"/>
  <!-- Tassel end -->
  <rect x="139" y="42" width="6" height="10" rx="2" fill="#f1c40f"/>
  <line x1="140" y1="52" x2="140" y2="56" stroke="#f1c40f" stroke-width="1.5"/>
  <line x1="142" y1="52" x2="142" y2="57" stroke="#f1c40f" stroke-width="1.5"/>
  <line x1="144" y1="52" x2="144" y2="55" stroke="#f1c40f" stroke-width="1.5"/>
</svg>
