<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <defs>
    <!-- Soft shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000022"/>
    </filter>
    <!-- Radial gradient for 3D roundness on head -->
    <radialGradient id="headGrad" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>
    <!-- Radial gradient for body -->
    <radialGradient id="bodyGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <!-- Radial gradient for belly -->
    <radialGradient id="bellyGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </radialGradient>
    <!-- Ear inner gradient -->
    <radialGradient id="earInner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <!-- Eye patch gradient -->
    <radialGradient id="patchGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
  </defs>

  <!-- === BODY (round, sitting) === -->
  <ellipse cx="100" cy="185" rx="52" ry="42" fill="url(#bodyGrad)" filter="url(#shadow)"/>

  <!-- Belly patch -->
  <ellipse cx="100" cy="182" rx="34" ry="30" fill="url(#bellyGrad)"/>

  <!-- === LEGS (stubby, pointing forward) === -->
  <ellipse cx="72" cy="215" rx="20" ry="14" fill="#1a1a1a" filter="url(#shadow)"/>
  <ellipse cx="128" cy="215" rx="20" ry="14" fill="#1a1a1a" filter="url(#shadow)"/>
  <!-- Leg sole pads -->
  <ellipse cx="72" cy="217" rx="12" ry="8" fill="#444"/>
  <circle cx="66" cy="211" r="3.5" fill="#444"/>
  <circle cx="72" cy="208" r="3.5" fill="#444"/>
  <circle cx="78" cy="211" r="3.5" fill="#444"/>
  <ellipse cx="128" cy="217" rx="12" ry="8" fill="#444"/>
  <circle cx="122" cy="211" r="3.5" fill="#444"/>
  <circle cx="128" cy="208" r="3.5" fill="#444"/>
  <circle cx="134" cy="211" r="3.5" fill="#444"/>

  <!-- === ARMS (small, at sides) === -->
  <ellipse cx="52" cy="175" rx="16" ry="11" fill="#1a1a1a" transform="rotate(-25 52 175)"/>
  <ellipse cx="148" cy="175" rx="16" ry="11" fill="#1a1a1a" transform="rotate(25 148 175)"/>

  <!-- === HEAD (large, round, overlapping body) === -->
  <!-- Ears (behind head) -->
  <circle cx="52" cy="52" r="22" fill="url(#earInner)" filter="url(#shadow)"/>
  <circle cx="148" cy="52" r="22" fill="url(#earInner)" filter="url(#shadow)"/>
  <!-- Ear inner (slightly lighter) -->
  <circle cx="52" cy="52" r="12" fill="#2d2d2d"/>
  <circle cx="148" cy="52" r="12" fill="#2d2d2d"/>

  <!-- Head main shape -->
  <ellipse cx="100" cy="88" rx="62" ry="58" fill="url(#headGrad)" filter="url(#shadow)"/>

  <!-- === EYE PATCHES (dark ovals around eyes) === -->
  <ellipse cx="72" cy="82" rx="22" ry="19" fill="url(#patchGrad)" transform="rotate(-8 72 82)"/>
  <ellipse cx="128" cy="82" rx="22" ry="19" fill="url(#patchGrad)" transform="rotate(8 128 82)"/>

  <!-- === EYES (big, round, shiny — 3D look) === -->
  <!-- Left eye white -->
  <ellipse cx="72" cy="80" rx="14" ry="15" fill="white"/>
  <!-- Left pupil -->
  <ellipse cx="74" cy="82" rx="9" ry="10" fill="#1a1a1a"/>
  <!-- Left eye shine (large) -->
  <circle cx="79" cy="77" r="5" fill="white" opacity="0.9"/>
  <!-- Left eye shine (small) -->
  <circle cx="70" cy="86" r="2.5" fill="white" opacity="0.6"/>

  <!-- Right eye white -->
  <ellipse cx="128" cy="80" rx="14" ry="15" fill="white"/>
  <!-- Right pupil -->
  <ellipse cx="126" cy="82" rx="9" ry="10" fill="#1a1a1a"/>
  <!-- Right eye shine (large) -->
  <circle cx="131" cy="77" r="5" fill="white" opacity="0.9"/>
  <!-- Right eye shine (small) -->
  <circle cx="122" cy="86" r="2.5" fill="white" opacity="0.6"/>

  <!-- === NOSE (small, round, dark) === -->
  <ellipse cx="100" cy="100" rx="7" ry="5.5" fill="#1a1a1a"/>
  <!-- Nose highlight -->
  <ellipse cx="98" cy="98" rx="2.5" ry="1.5" fill="#444"/>

  <!-- === MOUTH (gentle smile) === -->
  <path d="M 90 107 Q 95 114 100 107" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 100 107 Q 105 114 110 107" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

  <!-- === ROSY CHEEKS === -->
  <ellipse cx="56" cy="98" rx="10" ry="7" fill="#ffb0c8" opacity="0.45"/>
  <ellipse cx="144" cy="98" rx="10" ry="7" fill="#ffb0c8" opacity="0.45"/>
</svg>
